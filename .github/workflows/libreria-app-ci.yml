# CI per l'app LibreriBrà — gira solo sui path libreria-app/**
# (non tocca il progetto AI Security Scanner presente nello stesso repo)
name: LibreriBra App CI

on:
  push:
    paths:
      - "libreria-app/**"
      - ".github/workflows/libreria-app-ci.yml"
  pull_request:
    paths:
      - "libreria-app/**"

jobs:
  functions-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: libreria-app/firebase/functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: libreria-app/firebase/functions/package-lock.json
      - run: npm ci
      - run: npm run build

  emulator-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install test dependencies
        working-directory: libreria-app/firebase
        run: |
          npm --prefix functions ci
          npm --prefix functions run build
          npm --prefix tests install
      - name: Run rules + integration tests on Firestore emulator
        working-directory: libreria-app/firebase
        run: |
          npx --yes firebase-tools@13 emulators:exec --only firestore \
            --project demo-libreribra \
            "npm --prefix tests test && npm --prefix functions test"
